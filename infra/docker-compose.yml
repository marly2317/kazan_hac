# The deployable stack: Postgres, Django, the built SPA, and one nginx in front of both.
#
# Only nginx publishes a port. The backend and the SPA talk over the internal network, which is
# what keeps them on a single origin from the browser's point of view.
#
#   docker compose --env-file .env up --build
#
name: kazan-hack

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Postgres 18 keeps its cluster in a version-named subdirectory, so the mount belongs one
      # level up at /var/lib/postgresql. Mounting .../data instead leaves the real PGDATA inside
      # the container and the database is lost on recreate.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `-d`/`-U` explicitly: without them pg_isready checks the `postgres` database as the
      # `root` user and reports ready before this database exists.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Поисковый движок. Отдельный контейнер появился не ради «там всё для поиска», а ради двух
  # вещей, которых из Postgres выжать не удалось (замеры — docs/SEARCH_CHOICE.md): полнота
  # отбора и ранжирование **по индексу** одновременно, плюс kNN по вектору рядом с лексикой в
  # одном запросе.
  #
  # Порт наружу не публикуется: движок — производный индекс, источник истины остаётся в
  # Postgres, и доступ к нему нужен только бэкенду по внутренней сети.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      # Один узел: реплик нет, кворума нет, «yellow» для такого кластера — нормальное
      # состояние, а не неполадка.
      discovery.type: single-node
      # Демонстрационный security-плагин выключен вместе со своим самоподписанным
      # сертификатом и паролем по умолчанию. Включать его здесь было бы хуже, чем не включать:
      # движок не публикует порт, а демо-конфиг создаёт впечатление защиты, которой нет.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      # Куча фиксированного размера. 512 МБ хватает на справочник категорий хакатона с
      # запасом; Lucene и HNSW живут вне кучи, в отображённых файлах, и этот предел их не
      # ограничивает.
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: 'true'
    ulimits:
      # Куча, выгруженная в swap, стоит дороже, чем куча поменьше, — отсюда memory_lock.
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # Именно `yellow`: у единственного узла реплики разместить некуда, поэтому до `green`
      # кластер не дойдёт никогда и ожидание его было бы ожиданием вечности.
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      # Over plain HTTP a Secure cookie is never stored, so login would appear to succeed and
      # every follow-up request would arrive anonymous. Set both to 1 once TLS terminates here.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-0}
      SEED_CATALOG: ${SEED_CATALOG:-0}
      # Сбор наблюдений о нехватке в справочнике — необязательная возможность, см. .env.example.
      COLLECT_REFERENCE_GAPS: ${COLLECT_REFERENCE_GAPS:-1}
      # Empty by default: the rules forbid proprietary LLM APIs, so nothing is configured
      # until an open model is pointed at. See infra/.env.example.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-4.0}
      CACHE_URL: ${CACHE_URL:-locmemcache://spellcheck?timeout=604800&max_entries=10000}
      # Пустая строка — и поиск возвращается на Postgres: это не «аварийный режим», а
      # способ сравнить два движка на одном стенде, которым пользуется bench_retrieval.
      OPENSEARCH_URL: ${OPENSEARCH_URL-http://opensearch:9200}
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-ktru}
      OPENSEARCH_TIMEOUT: ${OPENSEARCH_TIMEOUT:-5.0}
      # Энкодер вшит в образ (см. backend/Dockerfile): на стенде хакатона сети может не быть,
      # а модель, скачиваемая при первом запросе, — это отказ в самый неподходящий момент.
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/opt/models/encoder}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Ссылка «войти как демонстрационный пользователь» под формой входа. Пусто по
        # умолчанию — ссылки тогда нет. Заполнять только вместе с `SEED_DEMO_USER=1`, иначе
        # ссылка будет предлагать вход в несуществующую учётную запись.
        #
        # Отдельные переменные, а не вывод из `SEED_DEMO_USER`: Compose не умеет условий, а
        # `${SEED_DEMO_USER:+…}` сработало бы и на значении `0`. Явное дублирование честнее
        # выражения, которое выглядит связанным, но связывает не то.
        VITE_DEMO_EMAIL: ${DEMO_LOGIN_EMAIL:-}
        VITE_DEMO_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
    restart: unless-stopped
    # Static files only; it never reaches the database or the backend directly.

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '${PUBLIC_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres-data:
  opensearch-data:
