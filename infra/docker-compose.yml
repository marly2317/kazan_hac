# The deployable stack: Postgres, Django, the built SPA, and one nginx in front of both.
#
# Only nginx publishes a port. The backend and the SPA talk over the internal network, which is
# what keeps them on a single origin from the browser's point of view.
#
#   docker compose --env-file .env up --build
#
name: kazan-hack

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Postgres 18 keeps its cluster in a version-named subdirectory, so the mount belongs one
      # level up at /var/lib/postgresql. Mounting .../data instead leaves the real PGDATA inside
      # the container and the database is lost on recreate.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `-d`/`-U` explicitly: without them pg_isready checks the `postgres` database as the
      # `root` user and reports ready before this database exists.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      # Over plain HTTP a Secure cookie is never stored, so login would appear to succeed and
      # every follow-up request would arrive anonymous. Set both to 1 once TLS terminates here.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-0}
      SEED_CATALOG: ${SEED_CATALOG:-0}
      # Исправление опечаток в демо-каталоге (модуль spellcheck): стадия LLM выключена.
      LLM_BASE_URL: ''
      CACHE_URL: ${CACHE_URL:-locmemcache://spellcheck?timeout=604800&max_entries=10000}
      # --- подбор КТРУ (apps/ste), см. infra/.env.example ---
      # Открытая модель через OpenAI-совместимый роутер или локальный Ollama/vLLM.
      STE_LLM_BASE_URL: ${STE_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      STE_LLM_API_KEY: ${STE_LLM_API_KEY:-}
      STE_LLM_MODEL: ${STE_LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      STE_LLM_FALLBACK_MODELS: ${STE_LLM_FALLBACK_MODELS:-}
      STE_LLM_STRUCTURED: ${STE_LLM_STRUCTURED:-prompt}
      STE_LLM_MIN_INTERVAL: ${STE_LLM_MIN_INTERVAL:-0}
      STE_LLM_CACHE_DIR: /app/var/llm_cache
      STE_EMBEDDER_ENABLED: ${STE_EMBEDDER_ENABLED:-1}
      STE_RERANKER_ENABLED: ${STE_RERANKER_ENABLED:-0}
      STE_LLM_FAMILY_SELECT: ${STE_LLM_FAMILY_SELECT:-0}
      STE_RERANK_TOP: ${STE_RERANK_TOP:-15}
      STE_FAMILY_SELECT_MODE: ${STE_FAMILY_SELECT_MODE:-top_k}
      STE_FAST_PATH: ${STE_FAST_PATH:-1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      # Первый старт прогревает базу знаний и эмбеддер (~10–20 с).
      start_period: 60s
    volumes:
      # Кэш ответов LLM: повтор того же описания — мгновенно и без расхода лимита запросов.
      - ste-llm-cache:/app/var/llm_cache

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Ссылка «войти как демонстрационный пользователь» под формой входа. Пусто по
        # умолчанию — ссылки тогда нет. Заполнять только вместе с `SEED_DEMO_USER=1`, иначе
        # ссылка будет предлагать вход в несуществующую учётную запись.
        #
        # Отдельные переменные, а не вывод из `SEED_DEMO_USER`: Compose не умеет условий, а
        # `${SEED_DEMO_USER:+…}` сработало бы и на значении `0`. Явное дублирование честнее
        # выражения, которое выглядит связанным, но связывает не то.
        VITE_DEMO_EMAIL: ${DEMO_LOGIN_EMAIL:-}
        VITE_DEMO_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
    restart: unless-stopped
    # Static files only; it never reaches the database or the backend directly.

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '${PUBLIC_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres-data:
  ste-llm-cache:
