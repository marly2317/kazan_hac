# The single public entrypoint.
#
# One origin for both halves: `/api/` and the admin reach Django, everything else reaches the SPA
# container. That is what makes the session cookie a same-origin cookie — no CORS, and `SameSite`
# can stay `Lax`.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# Login and registration are the two endpoints worth rate-limiting: without this, the password
# field is an open guessing oracle. 10r/m per IP with a small burst.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Django reads the real client and scheme from these; without them it would see the proxy's
    # address and treat every request as plain HTTP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    client_max_body_size 2m;

    location /api/v1/auth/login/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend;
    }

    location /api/v1/auth/register/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend;
    }

    location /api/ {
        proxy_pass http://backend;
        # Подбор КТРУ ждёт до двух ответов LLM; 60 с по умолчанию на бесплатном тарифе мало.
        proxy_read_timeout 180s;
    }

    # The admin and its static files: an internal back-office, same origin as everything else.
    location /admin/ {
        proxy_pass http://backend;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
