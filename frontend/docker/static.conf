# The SPA container: serve the built bundle, and let the history router own every unknown path.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames are immutable, so they may be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `index.html` must never be cached: a stale copy keeps pointing at bundle hashes that the
    # next deploy has already deleted.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Deep links like /account are routes, not files: hand them the shell and let vue-router
    # resolve them client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
