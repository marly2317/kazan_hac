[project]
name = "kazan-hack-backend"
version = "0.1.0"
description = "Modular monolith on Django: clean-architecture modules behind a session-auth API."
requires-python = "==3.13.*"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "symspellpy==6.10.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django; the next `makemigrations` would undo any reformatting.
"*/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["tests"]
